name: afd-hello

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-cptmtls
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_DNS_SUBSCRIPTION_ID: ${{ vars.AZURE_DNS_SUBSCRIPTION_ID }}
  ENDPOINT: cptmtls-hello
  HOST_LABEL: hello
  DNS_ZONE: cptdaz.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: afd-hello
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read base outputs
        run: |
          O() { az deployment group show -g "$RESOURCE_GROUP" -n base --query "properties.outputs.$1.value" -o tsv; }
          echo "PROFILE=$(O afdPublicName)" >> "$GITHUB_ENV"
          echo "HELLO_STORAGE=$(O helloStorage)" >> "$GITHUB_ENV"
          echo "PLS_ID=$(O plsId)" >> "$GITHUB_ENV"
          echo "VM_ORIGIN=$(O vmOriginHost)" >> "$GITHUB_ENV"
      - name: Pre-compute default hostname and create CNAME
        run: |
          TARGET=$(projects/mtlsupload/scripts/get-afd-hostname.sh "$ENDPOINT")
          projects/mtlsupload/scripts/dns-record.sh cname "$HOST_LABEL" "$TARGET"
      - name: Deploy AFD hello
        id: deploy
        run: |
          az deployment group create -g "$RESOURCE_GROUP" -n afd-hello \
            --template-file projects/mtlsupload/afd/hello.bicep \
            --parameters profileName="$PROFILE" endpointName="$ENDPOINT" hostName="$HOST_LABEL.$DNS_ZONE" \
                         helloStorageName="$HELLO_STORAGE" plsId="$PLS_ID" vmOriginHost="$VM_ORIGIN"
          TOKEN=$(az deployment group show -g "$RESOURCE_GROUP" -n afd-hello --query properties.outputs.validationToken.value -o tsv)
          projects/mtlsupload/scripts/dns-record.sh txt "_dnsauth.$HOST_LABEL" "$TOKEN"
      - name: Approve private endpoint connections
        run: |
          projects/mtlsupload/scripts/approve-pe.sh \
            "$(az storage account show -g "$RESOURCE_GROUP" -n "$HELLO_STORAGE" --query id -o tsv)" "$PLS_ID"
      - name: Wait for domain and test
        run: |
          projects/mtlsupload/scripts/wait-domain.sh "$RESOURCE_GROUP" "$PROFILE" "$HOST_LABEL-cptdaz-org"
          sleep 60
          curl -fsS "https://$HOST_LABEL.$DNS_ZONE/hello.txt"; echo
          curl -fsS "https://$HOST_LABEL.$DNS_ZONE/index.html" | head -5
