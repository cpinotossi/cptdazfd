name: afd-uploadp

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-cptmtls
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_DNS_SUBSCRIPTION_ID: ${{ vars.AZURE_DNS_SUBSCRIPTION_ID }}
  ENDPOINT: cptmtls-uploadp
  HOST_LABEL: uploadp
  DNS_ZONE: cptdaz.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: afd-uploadp
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read base outputs
        run: |
          O() { az deployment group show -g "$RESOURCE_GROUP" -n base --query "properties.outputs.$1.value" -o tsv; }
          echo "PROFILE=$(O afdUploadName)" >> "$GITHUB_ENV"
          echo "UPLOADP_STORAGE=$(O uploadpStorage)" >> "$GITHUB_ENV"
          echo "ID_ST=$(O idStId)" >> "$GITHUB_ENV"
      - name: Pre-compute default hostname and create CNAME
        run: |
          TARGET=$(projects/mtlsupload/scripts/get-afd-hostname.sh "$ENDPOINT")
          projects/mtlsupload/scripts/dns-record.sh cname "$HOST_LABEL" "$TARGET"
      - name: Deploy AFD uploadp (mTLS + managed identity origin authentication)
        run: |
          az deployment group create -g "$RESOURCE_GROUP" -n afd-uploadp \
            --template-file projects/mtlsupload/afd/uploadp.bicep \
            --parameters profileName="$PROFILE" endpointName="$ENDPOINT" hostName="$HOST_LABEL.$DNS_ZONE" \
                         uploadpStorageName="$UPLOADP_STORAGE" storageIdentityId="$ID_ST"
          TOKEN=$(az deployment group show -g "$RESOURCE_GROUP" -n afd-uploadp --query properties.outputs.validationToken.value -o tsv)
          projects/mtlsupload/scripts/dns-record.sh txt "_dnsauth.$HOST_LABEL" "$TOKEN"
      - name: Wait for domain
        run: projects/mtlsupload/scripts/wait-domain.sh "$RESOURCE_GROUP" "$PROFILE" "$HOST_LABEL-cptdaz-org"
      - name: Deploy path-scoped Edge Action
        env:
          HOST: ${{ env.HOST_LABEL }}.${{ env.DNS_ZONE }}
        run: bash projects/mtlsupload/scripts/deploy-upload-edge.sh
